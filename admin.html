<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المنتجات</title>
</head>
<body>
  <h1>إضافة منتج جديد</h1>
  <form id="productForm">
    <input type="text" name="name" placeholder="اسم المنتج" required>
    <input type="number" name="price" placeholder="السعر" required>
    <input type="text" name="package" placeholder="العبوة" required>
    <input type="file" name="image" required>
    <button type="submit">نشر المنتج</button>
  </form>

  <script>
    const API_URL = 'https://my-backend.onrender.com/api/products';
    const form = document.getElementById('productForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: data
        });
        if (!res.ok) throw new Error('فشل في إضافة المنتج');
        const product = await res.json();
        alert('تم نشر المنتج: ' + product.name);
        form.reset();
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
